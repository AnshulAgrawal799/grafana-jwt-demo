services:
  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana-jwt-demo
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      # ── JWT Authentication ──────────────────────────────────────────
      - GF_AUTH_JWT_ENABLED=true
      - GF_AUTH_JWT_URL_LOGIN=true
      - GF_AUTH_JWT_HEADER_NAME=X-JWT-Assertion
      - GF_AUTH_JWT_USERNAME_CLAIM=login
      - GF_AUTH_JWT_EMAIL_CLAIM=email
      - GF_AUTH_JWT_NAME_CLAIM=name
      - GF_AUTH_JWT_KEY_FILE=/etc/grafana/wow-web-public.pem
      - GF_AUTH_JWT_EXPECT_CLAIMS={"iss":"wow-web","aud":"grafana-insights"}
      - GF_AUTH_JWT_ROLE_ATTRIBUTE_PATH=role
      - GF_AUTH_JWT_ROLE_ATTRIBUTE_STRICT=true
      - GF_AUTH_JWT_CACHE_TTL=60m
      - GF_AUTH_JWT_AUTO_SIGN_UP=true
      # ── Security / Embedding ────────────────────────────────────────
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SAMESITE=lax
      - GF_SECURITY_COOKIE_SECURE=false # set true if using HTTPS
      - GF_AUTH_LOGIN_MAXIMUM_INACTIVE_LIFETIME_DURATION=15m
      - GF_AUTH_LOGIN_MAXIMUM_LIFETIME_DURATION=1h
      # ── Disable login form (optional – JWT only) ────────────────────
      # - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./backend/public.pem:/etc/grafana/wow-web-public.pem:ro
    networks:
      - demo-net

  web:
    image: node:20-alpine
    container_name: grafana-jwt-demo-web
    working_dir: /app
    ports:
      - "8080:3000"
    environment:
      - AUTHORIZED_EMAIL_DOMAINS=${AUTHORIZED_EMAIL_DOMAINS:-wheelocity.local,demo.local,test.com}
      - MAX_TOKEN_TTL_MINUTES=${MAX_TOKEN_TTL_MINUTES:-60}
      - GRAFANA_URL=${GRAFANA_URL:-http://localhost:3000}
      - GRAFANA_JWT_KEY_ID=${GRAFANA_JWT_KEY_ID:-wow-web-prod-20260531124246}
      - GRAFANA_JWT_ISSUER=${GRAFANA_JWT_ISSUER:-wow-web}
      - GRAFANA_JWT_AUDIENCE=${GRAFANA_JWT_AUDIENCE:-grafana-insights}
      - GRAFANA_JWT_ROLE=${GRAFANA_JWT_ROLE:-Viewer}
      - GRAFANA_JWT_DEFAULT_TTL_SECONDS=${GRAFANA_JWT_DEFAULT_TTL_SECONDS:-900}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install && npm run dev"
    networks:
      - demo-net
    depends_on:
      - grafana

volumes:
  grafana-storage:

networks:
  demo-net:
    driver: bridge
